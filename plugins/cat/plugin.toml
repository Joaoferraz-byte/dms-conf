id           = "dotnetrob/cat"
name         = "Cat"
version      = "1.4.1"
plugin_api   = 18
author       = "DotNetRob"
license      = "MIT"
dependencies = []
icon         = "paw"
description  = "An animated cat that sleeps without the tablet and walks while it is connected."
tags         = ["bar", "animation", "system", "fun"]

# Popup opened by clicking the bar widget: the kurukuru animation is centered
# above the Xournal++ note action. A floating center panel avoids tying the
# visual popup to the bar edge while the host default dismisses outside clicks.
[[panel]]
id              = "panel"
entry           = "cat_panel.luau"
width           = 380
height          = 430
placement       = "floating"
position        = "center"
open_near_click = false

[[widget]]
id    = "cat"
entry = "cat.luau"

  [[widget.setting]]
  key              = "cat_size"
  type             = "int"
  label_key        = "settings.cat_size.label"
  description_key  = "settings.cat_size.description"
  default          = 24
  min              = 12
  max              = 48

  [[widget.setting]]
  key              = "cat_color_mode"
  type             = "select"
  label_key        = "settings.cat_color_mode.label"
  description_key  = "settings.cat_color_mode.description"
  default          = "theme"
  options          = [
    { value = "theme", label_key = "settings.cat_color_mode.option_theme" },
    { value = "custom", label_key = "settings.cat_color_mode.option_custom" },
  ]

  [[widget.setting]]
  key              = "cat_color"
  type             = "color"
  label_key        = "settings.cat_color.label"
  description_key  = "settings.cat_color.description"
  default          = "#E8A24C"
  visible_when     = { key = "cat_color_mode", values = ["custom"] }
