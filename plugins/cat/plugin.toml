id           = "dotnetrob/cat"
name         = "Cat"
version      = "1.3.0"
plugin_api   = 9
author       = "DotNetRob"
license      = "MIT"
dependencies = []
icon         = "paw"
description  = "An animated cat that sleeps without the tablet and walks while it is connected."
tags         = ["bar", "animation", "system", "fun"]

# Popup opened by clicking the bar widget: the same cat, bigger, with a
# Xournal++ note action in the footer. Attached to the bar near the click; the
# host default dismiss-on-outside-click makes it behave like a transient popup.
[[panel]]
id              = "panel"
entry           = "cat_panel.luau"
width           = 280
height          = 240
placement       = "attached"
open_near_click = true

[[widget]]
id    = "cat"
entry = "cat.luau"

  [[widget.setting]]
  key              = "cat_size"
  type             = "int"
  label_key        = "settings.cat_size.label"
  description_key  = "settings.cat_size.description"
  default          = 24
  min              = 12
  max              = 48

  [[widget.setting]]
  key              = "cat_color_mode"
  type             = "select"
  label_key        = "settings.cat_color_mode.label"
  description_key  = "settings.cat_color_mode.description"
  default          = "theme"
  options          = [
    { value = "theme", label_key = "settings.cat_color_mode.option_theme" },
    { value = "custom", label_key = "settings.cat_color_mode.option_custom" },
  ]

  [[widget.setting]]
  key              = "cat_color"
  type             = "color"
  label_key        = "settings.cat_color.label"
  description_key  = "settings.cat_color.description"
  default          = "#E8A24C"
  visible_when     = { key = "cat_color_mode", values = ["custom"] }
